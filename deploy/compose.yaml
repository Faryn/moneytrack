name: moneytrack
services:
  web:
    image: moneytrack:prepared
    # Bind Phoenix directly to application host's Tailscale address. The scoped host
    # firewall admits only the nginx host and local health/admin checks.
    network_mode: host
    env_file: /etc/moneytrack/moneytrack.env
    user: "10100:10100"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    volumes:
      - /var/lib/moneytrack:/data
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 5 -H "Host: $$PHX_HOST" -H "X-Forwarded-Proto: https" "http://$$PHX_BIND_IP:$$PORT/api/health" >/dev/null']
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
